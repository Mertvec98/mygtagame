name: Build Bars APK
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev
          pip install --user --upgrade buildozer cython virtualenv
      - name: Build APK with Buildozer
        run: |
          buildozer init
          sed -i 's/android.permissions =/android.permissions = CAMERA, RECORD_AUDIO, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE, SYSTEM_ALERT_WINDOW, RECORD_SCREEN/' buildozer.spec
          buildozer android debug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Bars-Premium-APK
          path: bin/*.apk
          
