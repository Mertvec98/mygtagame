<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA: Mini Crime 2D</title>
    <script src="https://adsgram.ai"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 10px; overflow: hidden; user-select: none; }
        h1 { color: #f59e0b; font-size: 20px; text-transform: uppercase; margin: 5px 0; text-shadow: 2px 2px #000; }
        .score-board { display: flex; justify-content: space-around; background: #1e293b; padding: 8px; border-radius: 6px; border: 2px solid #334155; font-size: 14px; margin-bottom: 8px; }
        #gameCanvas { background: #020617; border: 3px solid #f59e0b; border-radius: 8px; display: block; margin: 0 auto; box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 10px auto; }
        .ctrl-btn { background: #d97706; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; box-shadow: 0 4px #92400e; cursor: pointer; }
        .ctrl-btn:active { background: #b45309; box-shadow: 0 2px #78350f; transform: translateY(2px); }
        .btn-fire { background: #ef4444; box-shadow: 0 4px #b91c1c; }
        .btn-fire:active { background: #dc2626; box-shadow: 0 2px #991b1b; }
        .money-panel { font-size: 11px; color: #4b5563; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>GTA: MINI CRIME 2D</h1>
    
    <div class="score-board">
        <div>⭐ Авторитет: <span id="exp" style="color:#10b981;">0</span> XP</div>
        <div>💰 Твой Баланс: <span id="balance" style="color:#f59e0b;">0.00</span> руб.</div>
    </div>

    <canvas id="gameCanvas" width="320" height="340"></canvas>

    <div class="controls">
        <button class="ctrl-btn" onclick="moveLeft()">◀</button>
        <button class="ctrl-btn btn-fire" onclick="fireWeapon()">💥ОГОНЬ</button>
        <button class="ctrl-btn" onclick="moveRight()">▶</button>
    </div>

    <button class="ctrl-btn" style="background:#10b981; box-shadow:0 4px #065f46; width:100%; max-width:320px; margin:5px auto; display:block;" onclick="shareGame()">🔗 Пригласить кентов (+50 XP)</button>

    <div class="money-panel">
        Вывод от 20 руб на ЮMoney под ручным контролем администратора.
    </div>

    <script {nonce}>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let exp = 0;
        let balance = 0.00;

        // Физика ретро-игры
        let player = { x: 140, y: 290, width: 40, height: 40, speed: 15 };
        let bullets = [];
        let enemies = [];
        let gameActive = true;
        let spawnTimer = 0;

        // Подключаем твой блок Adsgram 57809
        const AdController = window.Adsgram.init({ blockId: "57809", demo: true });

        function drawPlayer() {
            ctx.fillStyle = "#38bdf8"; // Твоя тачка/боец
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "#fff";
            ctx.font = "10px Arial";
            ctx.fillText("😎 Я", player.x + 8, player.y + 24);
        }

        function moveLeft() { if(player.x > 0) player.x -= player.speed; }
        function moveRight() { if(player.x < canvas.width - player.width) player.x += player.speed; }
        
        function fireWeapon() {
            bullets.push({ x: player.x + 18, y: player.y, width: 4, height: 10, speed: 7 });
        }

        function updateGame() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPlayer();

            // Движение пуль
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                ctx.fillStyle = "#f43f5e";
                ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].width, bullets[i].height);
                if (bullets[i].y < 0) bullets.splice(i, 1);
            }

            // Появление врагов (машины/бандиты) вверх ногами летят вниз
            spawnTimer++;
            if (spawnTimer % 40 === 0) {
                enemies.push({ x: Math.random() * (canvas.width - 30), y: -30, width: 32, height: 32, speed: 3 });
            }

            // Движение врагов и проверки на столкновения
            for (let e = enemies.length - 1; e >= 0; e--) {
                enemies[e].y += enemies[e].speed;
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(enemies[e].x, enemies[e].y, enemies[e].width, enemies[e].height);
                ctx.fillStyle = "#fff";
                ctx.fillText("🚘", enemies[e].x + 8, enemies[e].y + 20);

                // Столкновение с пулей (уничтожение врага)
                for (let b = bullets.length - 1; b >= 0; b--) {
                    if (bullets[b].x > enemies[e].x && bullets[b].x < enemies[e].x + enemies[e].width &&
                        bullets[b].y > enemies[e].y && bullets[b].y < enemies[e].y + enemies[e].height) {
                        enemies.splice(e, 1);
                        bullets.splice(b, 1);
                        updatePayout(10, 0.35); // Уничтожил — получил опыт и копейку
                        break;
                    }
                }

                // Авария (враг врезался в игрока) -> Вызов рекламы для воскрешения!
                if (enemies[e] && player.x < enemies[e].x + enemies[e].width && player.x + player.width > enemies[e].x &&
                    player.y < enemies[e].y + enemies[e].height && player.y + player.height > enemies[e].y) {
                    gameActive = false;
                    handleGameOver();
                }
            }

            requestAnimationFrame(updateGame);
        }

        function updatePayout(addExp, addMoney) {
            exp += addExp;
            balance += addMoney;
            document.getElementById("exp").innerText = exp;
            document.getElementById("balance").innerText = balance.toFixed(2);
        }

        function handleGameOver() {
            // Предлагаем посмотреть видеоролик, чтобы ожить и забрать куш
            let watchAd = confirm("🚨 ТЕБЯ СБИЛИ! Хочешь продолжить миссию, получить +5.00 руб бонус и сохранить авторитет? Посмотри короткое видео ровно 10 секунд!");
            
            if (watchAd) {
                AdController.show().then(() => {
                    // Игрок досмотрел рекламу
                    resetGame();
                    updatePayout(50, 5.00); // Даем мощный бонус в рублях за просмотр рекламы!
                    alert("Красава! Досмотрел до конца. На баланс начислено 5.00 руб, миссия продолжается!");
                }).catch(() => {
                    // Обходной путь если реклама от Adsgram еще на модерации
                    resetGame();
                    updatePayout(50, 5.00);
                    alert("Тестовый показ засчитан! На баланс начислено 5.00 руб в обход модерации Adsgram.");
                });
            } else {
                resetGame();
            }
        }

        function resetGame() {
            enemies = [];
            bullets = [];
            gameActive = true;
            requestAnimationFrame(updateGame);
        }

        function shareGame() {
            const shareText = "Здорово! Залетай в новую 2D-GTA прямо в Telegram. Сбивай тачки, проходи миссии и забирай рубли! Играть тут: t.me/GtaMiniCrime_bot/play";
            navigator.clipboard.writeText(shareText);
            updatePayout(50, 0.00);
            alert("Ссылка скопирована! Отправь её кентам в WhatsApp или Telegram.");
        }

        // Запуск ретро-движка
        requestAnimationFrame(updateGame);
    </script>
</body>
</html>
