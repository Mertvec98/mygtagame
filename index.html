<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA: Mini Crime</title>
    <!-- Подключаем официальный скрипт рекламы Adsgram -->
    <script src="https://adsgram.ai"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Courier New', monospace; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #f59e0b; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px #000; margin-bottom: 5px; }
        .subtitle { font-size: 12px; color: #6b7280; margin-bottom: 25px; }
        .stat-box { background: #1e293b; border: 2px solid #334155; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 18px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .highlight { color: #10b981; font-weight: bold; }
        .btn { background-color: #d97706; color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; max-width: 280px; margin: 10px auto; display: block; box-shadow: 0 4px #92400e; text-transform: uppercase; }
        .btn:active { background-color: #b45309; box-shadow: 0 2px #78350f; transform: translateY(2px); }
        .admin-panel { margin-top: 40px; font-size: 11px; color: #4b5563; border-top: 1px dashed #334155; padding-top: 15px; }
    </style>
</head>
<body>

    <h1>GTA: MINI CRIME</h1>
    <div class="subtitle">Версия: Эпоха 2000-х</div>

    <div class="stat-box">
        💼 Статус: <span id="rank" style="color: #38bdf8;">Уличный пацан</span><br><br>
        ⭐ Авторитет: <span id="exp" class="highlight">0</span> XP<br><br>
        💰 Баланс: <span id="balance" class="highlight">0.00</span> руб.
    </div>

    <button class="btn" onclick="showAdAndPay()">🔥 Пойти на дело</button>
    <button class="btn" style="background-color: #475569; box-shadow: 0 4px #334155;" onclick="alert('Гараж откроется на следующем цене!')">🚗 Мой Гараж</button>

    <div class="admin-panel">
        🔒 Лимит выплат на этот месяц: 30 000 руб.<br>
        Текущий вывод под ручным контролем администратора.
    </div>

    <script {nonce}>
        let exp = 0;
        let balance = 0.00;

        // Настройка рекламного блока Adsgram
        const AdController = window.Adsgram.init({ blockId: "54681" });

        function showAdAndPay() {
            // Запускаем показ видео-рекламы
            AdController.show().then((result) => {
                // Игрок успешно досмотрел рекламу — начисляем награду
                exp += 10;
                balance += 0.35; 

                document.getElementById('exp').innerText = exp;
                document.getElementById('balance').innerText = balance.toFixed(2);

                if (exp >= 100 && exp < 200) {
                    document.getElementById('rank').innerText = "Автоугонщик";
                } else if (exp >= 200) {
                    document.getElementById('rank').innerText = "Бригадир";
                }
                alert("Миссия выполнена! Награда зачислена. Деньги отправлены на ваш внутренний счет.");
            }).catch((result) => {
                // Если игрок скипнул рекламу или произошла ошибка
                alert("Чтобы выполнить миссию, необходимо досмотреть видео до конца!");
            });
        }
    </script>
</body>
</html>
